<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>송중계소·수신지점 지도</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --text:#1f2937; --muted:#6b7280; --line:#e5e7eb;
    --accent:#2563eb; --danger:#dc2626; --edit:#f59e0b; --radius:14px;
    --shadow:0 6px 24px rgba(15,23,42,.14);
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{margin:0;height:100%}
  body{font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
       color:var(--text);background:var(--bg);display:flex;flex-direction:column;height:100dvh;overflow:hidden;font-size:14px}
  button{font:inherit;cursor:pointer}
  input,select,textarea{font:inherit}

  /* 상단 바 */
  #topbar{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--line);z-index:20}
  #title{font-size:17px;font-weight:700;margin:0;white-space:nowrap}
  .tabs{display:flex;background:#f1f5f9;border-radius:10px;padding:3px;gap:2px;flex:none}
  .tab{border:none;background:transparent;padding:6px 12px;border-radius:8px;font-weight:600;color:var(--muted);white-space:nowrap}
  .tab.on{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  #searchWrap{position:relative;flex:1;min-width:0;max-width:460px}
  #search{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#f9fafb;outline:none}
  #search:focus{border-color:var(--accent);background:#fff}
  #searchResults{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--card);border-radius:12px;box-shadow:var(--shadow);
                 max-height:60vh;overflow:auto;z-index:40;padding:6px}
  .sr-item{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:8px;cursor:pointer}
  .sr-item:hover,.sr-item.active{background:#f1f5f9}
  .sr-sub{color:var(--muted);font-size:12px;margin-top:2px}
  .sr-head{font-size:12px;color:var(--muted);padding:6px 10px 2px}
  .tb-btn{padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:#fff;white-space:nowrap}
  .tb-btn:hover{background:#f3f4f6}
  #btnEdit.on{background:var(--edit);border-color:var(--edit);color:#fff;font-weight:600}

  /* 매체 필터 */
  #filters{display:flex;gap:6px;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--line);overflow-x:auto;z-index:15;scrollbar-width:none}
  #filters::-webkit-scrollbar{display:none}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:#fff;white-space:nowrap;font-size:13px}
  .chip .cnt{color:var(--muted);font-size:12px}
  .chip.off{opacity:.4}

  /* 지도 영역 */
  #mapWrap{position:relative;flex:1;min-height:0}
  #map{position:absolute;inset:0}
  #mapMsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg);z-index:5}
  #mapMsg .box{max-width:460px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;line-height:1.6}
  #mapMsg h2{margin:0 0 8px;font-size:17px}
  #mapMsg code{background:#f1f5f9;padding:1px 6px;border-radius:5px}

  .banner{position:absolute;left:50%;transform:translateX(-50%);top:10px;z-index:12;padding:8px 10px 8px 14px;border-radius:999px;
          box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;font-size:13px;max-width:calc(100% - 24px)}
  #editBanner{background:var(--edit);color:#fff;font-weight:600}
  #editBanner button{border:none;background:rgba(255,255,255,.25);color:#fff;border-radius:999px;padding:4px 10px;white-space:nowrap;flex:none}
  #demoBanner,#rxBanner{background:#111827;color:#fff;top:auto;bottom:16px}

  /* 지도 표시 */
  .pin{position:relative;width:var(--s);height:var(--s);border-radius:50%;background:var(--c);border:2px solid #fff;
       box-shadow:0 1px 3px rgba(0,0,0,.45);cursor:pointer;transition:transform .12s}
  .pin:hover{transform:scale(1.3)}
  .pin.sel{transform:scale(1.6);box-shadow:0 0 0 2px #111827,0 1px 4px rgba(0,0,0,.5)}
  .pin .lbl{position:absolute;left:calc(100% + 5px);top:50%;transform:translateY(-50%);white-space:nowrap;font-size:12px;font-weight:600;color:#111827;
            text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff,0 0 3px #fff;pointer-events:none}
  .pin.sel .lbl{font-size:8px}
  .pin .n{position:absolute;right:-8px;top:-8px;min-width:15px;height:15px;padding:0 3px;border-radius:8px;background:#111827;color:#fff;
          font-size:10px;line-height:15px;text-align:center;font-weight:700;pointer-events:none}
  .pin.sel .n{transform:scale(.65)}
  #mapWrap.far .pin .lbl{display:none}
  .ref{position:relative;width:22px;height:20px;pointer-events:none;opacity:.85}
  .ref svg{display:block}
  .ref .lbl{position:absolute;left:25px;top:50%;transform:translateY(-50%);white-space:nowrap;font-size:11px;color:#4b5563;
            text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff}
  #mapWrap.mid .ref .lbl{display:none}
  .tpin{width:24px;height:32px;color:#111827;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3));animation:bob 1s ease-in-out infinite}
  .tpin svg{display:block}
  .legend{display:flex;align-items:center;gap:12px;margin-left:auto;padding-left:12px;font-size:12px;color:var(--muted);white-space:nowrap}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .legend i{display:inline-block;width:calc(var(--s) * .7);height:calc(var(--s) * .7);border-radius:50%;background:var(--c);border:1.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
  .legend svg{display:block}
  @keyframes bob{50%{transform:translateY(-4px)}}
  .me-dot{width:16px;height:16px;border-radius:50%;background:#3b82f6;border:3px solid #fff;box-shadow:0 0 0 6px rgba(59,130,246,.25)}

  /* 떠 있는 버튼 */
  #fabs{position:absolute;right:12px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:11}
  .fab{width:42px;height:42px;border-radius:12px;border:none;background:#fff;box-shadow:var(--shadow);font-size:18px}

  /* 패널 */
  .panel{position:absolute;z-index:30;background:var(--card);box-shadow:var(--shadow);border-radius:var(--radius);display:flex;flex-direction:column;overflow:hidden}
  #sheet{left:12px;top:12px;bottom:12px;width:390px}
  body.list-open #sheet{left:344px}
  #listPanel{left:12px;top:12px;bottom:12px;width:320px}
  .p-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
  .p-head h2{margin:0;font-size:17px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .p-close{border:none;background:#f3f4f6;width:30px;height:30px;border-radius:8px;font-size:16px;flex:none}
  .p-body{padding:14px 16px;overflow:auto;flex:1}
  .p-foot{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
  .badge{display:inline-block;padding:3px 9px;border-radius:999px;color:#fff;background:var(--c);font-size:12px;font-weight:600;flex:none}
  table.spec{width:100%;border-collapse:collapse}
  table.spec th{width:38%;text-align:left;color:var(--muted);font-weight:500;padding:8px 8px 8px 0;vertical-align:top;border-bottom:1px solid #f1f5f9}
  table.spec td{padding:8px 0;border-bottom:1px solid #f1f5f9;word-break:break-all;white-space:pre-wrap}
  .coords{margin-top:12px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .meta{margin-top:6px;font-size:12px;color:var(--muted)}
  .links{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
  .btn{padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:#fff;text-decoration:none;color:inherit;font-size:13px;display:inline-flex;align-items:center;gap:6px}
  .btn:hover{background:#f9fafb}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .btn.primary:hover{background:#1d4ed8}
  .btn.danger{color:var(--danger);border-color:#fecaca}
  .btn.danger.solid{background:var(--danger);color:#fff;border-color:var(--danger)}
  .btn.small{padding:4px 9px;font-size:12px}
  .btn:disabled{opacity:.5;cursor:default}
  .edit-only{display:none}
  body.editing .edit-only{display:flex}

  /* 수신지점 상세 */
  .pinfo{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:12px}
  .mcard{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
  .mcard.dim{opacity:.45}
  .mh{display:flex;align-items:center;gap:8px;margin-bottom:4px}
  .mt{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mcard table.spec th{width:46%;padding:6px 8px 6px 0}
  .mcard table.spec td{padding:6px 0}
  .mcard table.spec tr:last-child th,.mcard table.spec tr:last-child td{border-bottom:none}
  .acts{display:none;gap:6px;margin-top:8px}
  body.editing .acts{display:flex}
  .sec-title{font-size:12px;color:var(--muted);margin:4px 0 8px;font-weight:600}

  /* 입력 폼 */
  .field{margin-bottom:12px}
  .field label,.field .flabel{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
  .field .req{color:var(--danger)}
  .field input,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;outline:none;background:#fff}
  .field input:focus,.field textarea:focus{border-color:var(--accent)}
  .field textarea{min-height:70px;resize:vertical}
  .seg{display:flex;flex-wrap:wrap;gap:6px}
  .seg button{padding:7px 13px;border:1px solid var(--line);border-radius:9px;background:#fff;min-width:44px}
  .seg button.on{background:var(--c, var(--accent));border-color:var(--c, var(--accent));color:#fff;font-weight:600}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .hint{font-size:12px;color:var(--muted);background:#f8fafc;border-radius:9px;padding:9px 11px;margin-bottom:12px;line-height:1.5}
  .form-pt{font-weight:600;margin-bottom:12px}

  /* 목록 */
  .li{display:flex;gap:10px;padding:10px 6px;border-bottom:1px solid #f1f5f9;cursor:pointer;border-radius:8px}
  .li:hover{background:#f8fafc}
  .li .d{width:10px;height:10px;border-radius:50%;background:var(--c);margin-top:5px;flex:none}
  .li .n{font-weight:600}
  .li .s{font-size:12px;color:var(--muted);margin-top:2px}
  .empty{color:var(--muted);text-align:center;padding:30px 10px;line-height:1.6}

  /* 모달, 토스트 */
  #modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
  #modal .box{background:#fff;border-radius:var(--radius);width:100%;max-width:380px;padding:20px;box-shadow:var(--shadow)}
  #modal h3{margin:0 0 10px;font-size:16px}
  #modal .m-body{color:#374151;line-height:1.6;margin-bottom:16px}
  #modal .m-body input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;margin-top:8px;outline:none}
  #modal .m-foot{display:flex;justify-content:flex-end;gap:8px}
  #toast{position:fixed;left:50%;bottom:76px;transform:translate(-50%,20px);background:#111827;color:#fff;padding:10px 16px;border-radius:10px;
         opacity:0;pointer-events:none;transition:.2s;z-index:200;max-width:calc(100% - 32px);text-align:center}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #toast.err{background:var(--danger)}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* 모바일 */
  @media (max-width:720px){
    #topbar{flex-wrap:wrap;gap:8px}
    #title{display:none}
    .tabs{flex:1}
    .tab{flex:1;padding:7px 6px}
    #searchWrap{order:3;flex-basis:100%;max-width:none}
    .tb-btn{padding:7px 10px}
    #sheet,#listPanel,body.list-open #sheet{left:0;right:0;bottom:0;top:auto;width:auto;max-height:70%;border-radius:18px 18px 0 0}
    #sheet .p-head::before,#listPanel .p-head::before{content:"";position:absolute;left:50%;top:6px;width:36px;height:4px;border-radius:2px;background:#d1d5db;transform:translateX(-50%)}
    .p-head{position:relative;padding-top:18px}
    #demoBanner,#rxBanner{bottom:70px}
    .banner{font-size:12px;border-radius:14px;width:max-content}
    #toast{bottom:auto;top:130px}
    .row2{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<header id="topbar">
  <h1 id="title">송중계소·수신지점 지도</h1>
  <div class="tabs" role="tablist">
    <button class="tab on" data-mode="st">① 송중계소</button>
    <button class="tab" data-mode="rx">② 수신지점</button>
  </div>
  <div id="searchWrap">
    <input id="search" type="search" placeholder="국소명·주소 검색, 또는 산 이름으로 이동" autocomplete="off">
    <div id="searchResults" hidden></div>
  </div>
  <button class="tb-btn" id="btnList">☰ 목록</button>
  <button class="tb-btn" id="btnEdit">✏️ 편집</button>
</header>
<nav id="filters"></nav>

<main id="mapWrap">
  <div id="map"></div>
  <div id="mapMsg" hidden></div>
  <div class="banner" id="editBanner" hidden><span id="editBannerText"></span><button id="btnEditOff">끝내기</button></div>
  <div class="banner" id="demoBanner" hidden>예시 모드 · 구글 시트가 아직 연결되지 않았어요 (추가한 내용은 새로고침하면 사라져요)</div>
  <div class="banner" id="rxBanner" hidden>수신지점을 저장하려면 구글 Apps Script를 새 버전(Code.gs 2판)으로 바꿔 주세요</div>
  <div id="fabs">
    <button class="fab" id="btnFit" title="전체 보기">⤢</button>
    <button class="fab" id="btnMyLoc" title="내 위치">◎</button>
    <button class="fab" id="btnRefresh" title="새로고침">↻</button>
  </div>
  <aside class="panel" id="sheet" hidden></aside>
  <aside class="panel" id="listPanel" hidden></aside>
</main>

<div id="modal" hidden><div class="box"><h3 id="mTitle"></h3><div class="m-body" id="mBody"></div><div class="m-foot" id="mFoot"></div></div></div>
<div id="toast"></div>

<script>
/* =========================================================
   ▼▼▼ 설정 ▼▼▼
   ========================================================= */
const CONFIG = {
  KAKAO_JS_KEY: '387c58ebfbe029da14c01c2dab8a6678',   // 카카오 디벨로퍼스의 "JavaScript 키"
  API_URL: 'https://script.google.com/macros/s/AKfycbxY9TQnHdkXk_XJQr03MufilQVV6e6xEYKKpUCguXEBDY6N3z4_lHCJXK2e03APsZjZ/exec', // 구글 Apps Script 웹 앱 URL
  TITLE: '송중계소·수신지점 지도'                         // 화면 위쪽 제목
};
/* ========================================================= */

/* ---------- ① 송중계소 설정 ---------- */
// 지도 동그라미: '출력' 칸 기준 (1kW 이상 / 1kW 미만 / 입력 안 됨·단위 없음)
const POWER_FIELD = '출력';
const POWER_STYLE = {
  high:    { color:'#dc2626', size:22, label:'1kW 이상' },
  low:     { color:'#2563eb', size:16, label:'1kW 미만' },
  unknown: { color:'#9ca3af', size:19, label:'출력 확인 필요' }
};
// 매체별 색깔 (상세 카드·검색 결과의 매체 표시에 쓰입니다)
const MEDIA_COLORS = { 'TV':'#2563eb', 'DTV':'#2563eb', 'UHD':'#7c3aed', 'FM':'#16a34a', 'AM':'#ea580c', 'DMB':'#db2777' };
const EXTRA_COLORS = ['#0891b2','#ca8a04','#4f46e5','#be123c','#059669','#9333ea','#475569','#c2410c'];
const SUGGEST = {
  '매체': ['TV','UHD','FM','AM','DMB'],
  '구분': ['송신소','중계소','간이중계소'],
  '편파': ['수평','수직','원편파','혼합']
};
const F = { id:'id', media:'매체', name:'국소명', lat:'위도', lng:'경도', addr:'주소', updated:'수정일시', memo:'비고' };
const ST_NOT_IN_FORM = new Set([F.id, F.updated]);
const ST_NOT_IN_DETAIL = new Set([F.id, F.media, F.name, F.lat, F.lng, F.updated]);

/* ---------- ② 수신지점 설정 ---------- */
const R = { id:'id', pid:'지점id', name:'지점명', lat:'위도', lng:'경도', addr:'주소', media:'매체', judge:'판정',
            target:'대상 송신소', time:'측정일시', who:'측정자', ch:'채널/주파수', bc:'방송사', memo:'비고', updated:'수정일시' };
const RX_MEDIA = ['UHD','DTV','DMB','FM'];
// 매체를 고르면 아래 칸만 추가로 보여 줍니다 (여기 없는 칸은 매체와 상관없이 항상 보여요)
const RX_MEDIA_FIELDS = {
  'UHD': ['MER(dB)','SNR(dB)'],
  'DTV': ['MER(dB)','SNR(dB)'],
  'DMB': ['SNR(dB)','BER'],
  'FM':  ['음질(1~5점)','다중경로']
};
// 판정별 동그라미 색. 한 지점에 측정이 여러 개면 가장 나쁜 판정 색으로 표시합니다.
const JUDGE = {
  '양호': { color:'#16a34a', rank:1 },
  '보통': { color:'#f59e0b', rank:2 },
  '불량': { color:'#dc2626', rank:3 }
};
const JUDGE_NONE = { color:'#9ca3af', label:'판정 없음' };
const RX_PIN_SIZE = 19;
const RX_SEGMENTS = { '매체': RX_MEDIA, '판정': Object.keys(JUDGE), '음질(1~5점)': ['1','2','3','4','5'], '다중경로': ['무','유'] };
const RX_SYSTEM = new Set([R.id, R.pid, R.updated]);
const RX_LOCATION = [R.name, R.lat, R.lng, R.addr];
const RX_CARD_SKIP = new Set([R.id, R.pid, R.name, R.lat, R.lng, R.addr, R.media, R.bc, R.ch, R.judge, R.updated]);
const RX_DEFAULT_HEADERS = ['id','지점id','지점명','위도','경도','주소','측정일시','측정자','매체','방송사','채널/주파수','대상 송신소',
  '수신안테나높이(m)','전계강도(dBμV/m)','MER(dB)','SNR(dB)','BER','음질(1~5점)','다중경로','판정','비고','수정일시'];

/* ---------- 예시 데이터 (구글 시트 연결 전에만 쓰임) ---------- */
const DEMO = !CONFIG.API_URL;
const DEMO_ST_HEADERS = ['id','매체','방송사','국소명','구분','채널/주파수','출력','안테나높이(m)','해발고(m)','편파','주소','위도','경도','비고','수정일시'];
let demoSt = [

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(String(v ?? '').trim()); return Number.isFinite(n) ? n : NaN; };
const str = v => String(v ?? '').trim();
const mediaOf = r => str(r['매체']) || '미분류';
const hasCoords = r => Number.isFinite(num(r['위도'])) && Number.isFinite(num(r['경도']));
function colorOf(media){
  const key = String(media).toUpperCase();
  for (const k in MEDIA_COLORS) if (k.toUpperCase() === key) return MEDIA_COLORS[k];
  let h = 0; for (const ch of String(media)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return EXTRA_COLORS[h % EXTRA_COLORS.length];
}
function mediaSort(order){
  return (a, b) => { const ia = order.indexOf(a), ib = order.indexOf(b); return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.localeCompare(b, 'ko'); };
}
// "10 kW", "500W", "1,000 W", "0.5킬로와트" → 와트(W) 숫자. 단위가 없으면 NaN
function powerW(v){
  const s = String(v ?? '').replace(/,/g, '').trim();
  const m = s.match(/(\d+(?:\.\d+)?)\s*(k\s*w|킬로\s*와트|와트|w)(?![a-z])/i);
  if (!m) return NaN;
  const n = parseFloat(m[1]);
  return /^(k|킬로)/i.test(m[2]) ? n * 1000 : n;
}
function powerClass(s){
  const w = powerW(s[POWER_FIELD]);
  if (!Number.isFinite(w)) return 'unknown';
  return w >= 1000 ? 'high' : 'low';
}
// 가장 나쁜 판정 → {key, color} 또는 null
function worstJudge(items){
  let best = null;
  items.forEach(it => { const k = str(it[R.judge]); const j = JUDGE[k]; if (j && (!best || j.rank > best.rank)) best = { key:k, ...j }; });
  return best;
}
function judgeColor(k){ return (JUDGE[str(k)] || JUDGE_NONE).color; }
function distKm(a1, o1, a2, o2){
  const r = Math.PI / 180, dA = (a2 - a1) * r, dO = (o2 - o1) * r;
  const x = Math.sin(dA / 2) ** 2 + Math.cos(a1 * r) * Math.cos(a2 * r) * Math.sin(dO / 2) ** 2;
  return 6371 * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1 - x));
}
function nowStr(){ return new Date().toLocaleString('sv-SE', { timeZone:'Asia/Seoul' }).slice(0, 16); }
function toast(msg, isErr){
  const t = $('#toast'); t.textContent = msg; t.className = 'show' + (isErr ? ' err' : '');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.className = '', isErr ? 4500 : 2400);
}

function lsSet(k, v){ try { localStorage.setItem(k, v); } catch(_){} }
function lsGet(k){ try { return localStorage.getItem(k) || ''; } catch(_){ return ''; } }

/* ---------- 모달 ---------- */
function modal({ title, body, ok = '확인', cancel = '취소', danger = false, input = null }){
  return new Promise(resolve => {
    $('#mTitle').textContent = title;
    const mb = $('#mBody'); mb.innerHTML = '';
    if (typeof body === 'string') mb.innerHTML = body; else if (body) mb.appendChild(body);
    let inp = null;
    if (input){ inp = document.createElement('input'); Object.assign(inp, input); mb.appendChild(inp); }
    const foot = $('#mFoot'); foot.innerHTML = '';
    const close = val => { $('#modal').hidden = true; document.removeEventListener('keydown', onKey); resolve(val); };
    if (cancel){ const c = document.createElement('button'); c.className = 'btn'; c.textContent = cancel; c.onclick = () => close(null); foot.appendChild(c); }
    const o = document.createElement('button'); o.className = 'btn ' + (danger ? 'danger solid' : 'primary'); o.textContent = ok;
    o.onclick = () => close(inp ? inp.value : true); foot.appendChild(o);
    const onKey = e => { if (e.key === 'Escape') close(null); if (e.key === 'Enter' && inp) close(inp.value); };
    document.addEventListener('keydown', onKey);
    $('#modal').hidden = false;
    setTimeout(() => (inp || o).focus(), 50);
  });
}

/* ---------- 카카오 지도 불러오기 ---------- */
function loadKakao(){
  return new Promise((resolve, reject) => {
    if (!CONFIG.KAKAO_JS_KEY) return reject(new Error('NO_KEY'));
    const s = document.createElement('script');
    s.src = 'https://dapi.kakao.com/v2/maps/sdk.js?autoload=false&libraries=services&appkey=' + encodeURIComponent(CONFIG.KAKAO_JS_KEY);
    const timer = setTimeout(() => reject(new Error('SDK')), 15000);
    s.onload = () => {
      if (window.kakao && kakao.maps && kakao.maps.load) kakao.maps.load(() => { clearTimeout(timer); resolve(); });
      else { clearTimeout(timer); reject(new Error('SDK')); }
    };
    s.onerror = () => { clearTimeout(timer); reject(new Error('SDK')); };
    document.head.appendChild(s);
  });
}

/* ---------- 데이터 통신 ---------- */
function demoData(extra = {}){
  return { ok:true, ...extra,
    stations: { headers: DEMO_ST_HEADERS.slice(), rows: demoSt.map(r => ({...r})) },
    measurements: { headers: RX_DEFAULT_HEADERS.slice(), rows: demoRx.map(r => ({...r})) } };
}
async function fetchData(){
  if (DEMO) return demoData();
  const res = await fetch(CONFIG.API_URL + (CONFIG.API_URL.includes('?') ? '&' : '?') + 't=' + Date.now());
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || '불러오기 실패');
  return j;
}
async function api(action, payload = {}, pw = password){
  if (DEMO) return demoApi(action, payload);
  const res = await fetch(CONFIG.API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },   // 구글 Apps Script 와 통신하기 위한 방식
    body: JSON.stringify({ action, password: pw, ...payload })
  });
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || '저장 실패');
  return j;
}
function demoApi(action, { sheet = 'st', id, record = {}, field, value } = {}){
  if (action === 'check') return Promise.resolve({ ok:true });
  const now = nowStr();
  const rid = () => Math.random().toString(36).slice(2, 10);
  let arr = sheet === 'rx' ? demoRx : demoSt, newId = null, newPid = null;
  if (action === 'add'){
    newId = rid(); const row = { ...record, id:newId, 수정일시:now };
    if (sheet === 'rx'){ newPid = str(record[R.pid]) || rid(); row[R.pid] = newPid; }
    arr.push(row);
  }
  if (action === 'update'){ const r = arr.find(x => x.id === id); if (r) Object.assign(r, record, { 수정일시:now }); }
  if (action === 'delete'){ arr = arr.filter(x => x.id !== id); }
  if (action === 'updateWhere'){ arr.filter(x => str(x[field]) === String(value)).forEach(r => Object.assign(r, record, { 수정일시:now })); }
  if (action === 'deleteWhere'){ arr = arr.filter(x => str(x[field]) !== String(value)); }
  if (sheet === 'rx') demoRx = arr; else demoSt = arr;
  return Promise.resolve(demoData({ id:newId, pid:newPid }));
}

async function refresh(showMsg){
  const btn = $('#btnRefresh'); btn.innerHTML = '<span class="spin"></span>';
  try {
    applyData(await fetchData());
    if (showMsg) toast(mode === 'st' ? `송중계소 ${stations.length}곳을 불러왔어요` : `수신지점 ${points.length}곳을 불러왔어요`);
  } catch(e){
    toast('데이터를 불러오지 못했어요: ' + e.message, true);
  } finally { btn.textContent = '↻'; }
}

function groupPoints(rows){
  const m = new Map();
  rows.forEach(r => {
    const key = str(r[R.pid]) || '_' + [str(r[R.name]), num(r[R.lat]).toFixed(5), num(r[R.lng]).toFixed(5)].join('|');
    if (!m.has(key)) m.set(key, { pid:key, name:str(r[R.name]), lat:num(r[R.lat]), lng:num(r[R.lng]), addr:str(r[R.addr]), items:[] });
    m.get(key).items.push(r);
  });
  const order = mediaSort(RX_MEDIA);
  m.forEach(p => p.items.sort((a, b) => order(mediaOf(a), mediaOf(b)) || str(b[R.time]).localeCompare(str(a[R.time]))));
  return [...m.values()];
}

function applyData(j){
  const st = j.stations || { headers: j.headers || [], rows: j.rows || [] };
  rxSupported = !!j.measurements;
  const rx = j.measurements || { headers: RX_DEFAULT_HEADERS.slice(), rows: [] };
  stHeaders = (st.headers || []).filter(Boolean);
  stations = (st.rows || []).filter(r => r[F.id] && hasCoords(r));
  rxHeaders = (rx.headers || []).filter(Boolean);
  meas = (rx.rows || []).filter(r => r[R.id] && hasCoords(r));
  points = groupPoints(meas);
  const skipped = (st.rows || []).length - stations.length + (rx.rows || []).length - meas.length;
  $('#rxBanner').hidden = !(mode === 'rx' && !rxSupported);

  redraw(); renderFilters(); renderList();
  if (selected && sheetMode === 'detail'){
    if (selected.type === 'st'){ const s = stations.find(x => x[F.id] === selected.id); s ? openStDetail(s) : closeSheet(); }
    else { const p = points.find(x => x.pid === selected.id); p ? openRxDetail(p) : closeSheet(); }
  }
  if (firstLoad){
    firstLoad = false;
    const h = decodeURIComponent(location.hash.slice(1));
    if (h === 'rx' || h.startsWith('p-')){
      setMode('rx', { keepView:true });
      const p = h.startsWith('p-') && points.find(x => x.pid === h.slice(2));
      if (p){ map.setLevel(6); select('rx', p.pid); } else fitAll();
    } else {
      const s = h && stations.find(x => x[F.id] === h);
      if (s){ map.setLevel(6); select('st', s[F.id]); } else fitAll();
    }
    if (skipped > 0) toast(`위도·경도가 비어 있는 ${skipped}개 행은 지도에 표시하지 않았어요`);
  }
}

/* ---------- 지도에 그리기 ---------- */
const PIN_SVG = '<svg viewBox="0 0 24 32" width="24" height="32"><path d="M12 0C5.4 0 0 5.4 0 12c0 9 12 20 12 20s12-11 12-20C24 5.4 18.6 0 12 0z" fill="currentColor" stroke="#fff" stroke-width="1.6"/><circle cx="12" cy="12" r="4.6" fill="#fff"/></svg>';
const TRI_SVG = '<svg width="22" height="20" viewBox="0 0 14 13"><path d="M7 1.2 L13 11.8 H1 Z" fill="#374151" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg>';

function circleEl(color, size, label, title, count){
  const el = document.createElement('div');
  el.className = 'pin';
  el.style.setProperty('--c', color); el.style.setProperty('--s', size + 'px');
  if (title) el.title = title;
  el.innerHTML = '<span class="lbl"></span>' + (count > 1 ? `<span class="n">${count}</span>` : '');
  el.querySelector('.lbl').textContent = label || '';
  return el;
}
function addOverlay(key, lat, lng, el, z, clickable, onClick){
  if (onClick) el.addEventListener('click', ev => { ev.stopPropagation(); onClick(); });
  const overlay = new kakao.maps.CustomOverlay({ position: new kakao.maps.LatLng(lat, lng), content: el, xAnchor: .5, yAnchor: .5, clickable, zIndex: z });
  overlay.setMap(map);
  pins.set(key, { overlay, el, z });
}
function redraw(){
  pins.forEach(p => p.overlay.setMap(null)); pins.clear(); selKey = null;
  if (mode === 'st'){
    stations.forEach(s => {
      if (hidden.st.has(mediaOf(s))) return;
      const cls = powerClass(s), st = POWER_STYLE[cls];
      addOverlay('st:' + s[F.id], num(s[F.lat]), num(s[F.lng]), circleEl(st.color, st.size, s[F.name] || '(이름 없음)', st.label),
        cls === 'high' ? 4 : 3, true, () => select('st', s[F.id]));
    });
  } else {
    // 송중계소는 참고용 ▲ 로 흐리게
    stations.forEach(s => {
      const el = document.createElement('div'); el.className = 'ref';
      el.innerHTML = TRI_SVG + '<span class="lbl"></span>'; el.querySelector('.lbl').textContent = s[F.name] || '';
      addOverlay('ref:' + s[F.id], num(s[F.lat]), num(s[F.lng]), el, 1, false, null);
    });
    points.forEach(p => {
      const vis = p.items.filter(it => !hidden.rx.has(mediaOf(it)));
      if (!vis.length) return;
      const wj = worstJudge(vis);
      addOverlay('rx:' + p.pid, p.lat, p.lng, circleEl(wj ? wj.color : JUDGE_NONE.color, RX_PIN_SIZE, p.name || '(이름 없음)', wj ? wj.key : JUDGE_NONE.label, vis.length),
        wj ? 3 + wj.rank : 3, true, () => select('rx', p.pid));
    });
  }
  if (selected) markSelected(selected.type + ':' + selected.id);
}
function markSelected(key){
  if (selKey && pins.get(selKey)){ const p = pins.get(selKey); p.el.classList.remove('sel'); p.overlay.setZIndex(p.z); }
  selKey = key;
  const p = key && pins.get(key);
  if (p){ p.el.classList.add('sel'); p.overlay.setZIndex(10); }
}
function fitAll(){
  const pts = mode === 'st'
    ? stations.filter(s => !hidden.st.has(mediaOf(s))).map(s => [num(s[F.lat]), num(s[F.lng])])
    : points.filter(p => p.items.some(it => !hidden.rx.has(mediaOf(it)))).map(p => [p.lat, p.lng]);
  if (!pts.length) return;
  if (pts.length === 1){ map.setLevel(7); map.setCenter(new kakao.maps.LatLng(pts[0][0], pts[0][1])); return; }
  const b = new kakao.maps.LatLngBounds();
  pts.forEach(([a, o]) => b.extend(new kakao.maps.LatLng(a, o)));
  map.setBounds(b, 60, 60, 60, 60);
}

/* ---------- 메뉴 전환 ---------- */
function setMode(m, opts = {}){
  if (mode === m && !opts.force) return;
  closeSheet(); endMove(); clearTemp();
  mode = m;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.mode === m));
  $('#search').value = ''; $('#searchResults').hidden = true;
  $('#search').placeholder = m === 'st' ? '국소명·주소 검색, 또는 산 이름으로 이동' : '지점명·주소 검색, 또는 장소 이름으로 이동';
  $('#editBannerText').textContent = editBannerText();
  $('#rxBanner').hidden = !(m === 'rx' && !rxSupported);
  redraw(); renderFilters(); renderList();
  if (!opts.keepView) fitAll();
  setHash(m === 'rx' ? 'rx' : '');
}
function editBannerText(){
  return mode === 'st' ? '편집 모드 · 지도를 눌러 새 송중계소를 추가하세요' : '편집 모드 · 지도를 눌러 새 수신지점을 추가하세요';
}

/* ---------- 필터 & 범례 ---------- */
function renderFilters(){
  const rows = mode === 'st' ? stations : meas;
  const counts = {};
  rows.forEach(r => { const m = mediaOf(r); counts[m] = (counts[m] || 0) + 1; });
  const medias = Object.keys(counts).sort(mediaSort(mode === 'st' ? Object.keys(MEDIA_COLORS) : RX_MEDIA));
  const set = hidden[mode];
  const nav = $('#filters'); nav.innerHTML = '';
  const all = document.createElement('button');
  all.className = 'chip'; all.innerHTML = `전체 <span class="cnt">${rows.length}</span>`;
  all.onclick = () => { set.clear(); updateVisibility(); };
  nav.appendChild(all);
  medias.forEach(m => {
    const b = document.createElement('button');
    b.className = 'chip' + (set.has(m) ? ' off' : '');
    b.innerHTML = `${esc(m)} <span class="cnt">${counts[m]}</span>`;
    b.onclick = () => { set.has(m) ? set.delete(m) : set.add(m); updateVisibility(); };
    nav.appendChild(b);
  });
  const lg = document.createElement('div'); lg.className = 'legend';
  if (mode === 'st'){
    const pc = { high:0, low:0, unknown:0 };
    stations.filter(s => !set.has(mediaOf(s))).forEach(s => pc[powerClass(s)]++);
    lg.innerHTML = Object.entries(POWER_STYLE).filter(([k]) => k !== 'unknown' || pc.unknown)
      .map(([k, st]) => `<span><i style="--c:${st.color};--s:${st.size}px"></i>${st.label} ${pc[k]}</span>`).join('');
  } else {
    const jc = {}; let none = 0;
    points.forEach(p => {
      const vis = p.items.filter(it => !set.has(mediaOf(it))); if (!vis.length) return;
      const wj = worstJudge(vis); wj ? jc[wj.key] = (jc[wj.key] || 0) + 1 : none++;

      + (stations.length ? `<span>${TRI_SVG.replace('width="22" height="20"', 'width="13" height="12"')}송중계소</span>` : '');
  }
  nav.appendChild(lg);
}

function findStation(name){
  const n = str(name).replace(/\s+/g, ''); if (!n) return null;
  const exact = stations.find(s => str(s[F.name]).replace(/\s+/g, '') === n);
  if (exact) return exact;
  const part = stations.filter(s => { const sn = str(s[F.name]).replace(/\s+/g, ''); return sn && (sn.includes(n) || n.includes(sn)); });
  return part.length === 1 ? part[0] : null;
}

/* ---------- 입력 칸 만들기 ---------- */
let fieldSeq = 0;
function datalistFor(opts){
  const dl = document.createElement('datalist'); dl.id = 'dl' + (fieldSeq++);
  [...opts].forEach(o => { const op = document.createElement('option'); op.value = o; dl.appendChild(op); });
  return dl;
}
function makeSeg(name, options, value, colors){
  const wrap = document.createElement('div'); wrap.className = 'seg';
  const hid = document.createElement('input'); hid.type = 'hidden'; hid.name = name; hid.value = value || '';
  const opts = [...options]; if (value && !opts.includes(value)) opts.push(value);
  const sync = () => wrap.querySelectorAll('button').forEach(x => x.classList.toggle('on', x.dataset.v === hid.value));
  opts.forEach(o => {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = o; b.dataset.v = o;
    if (colors && colors[o]) b.style.setProperty('--c', colors[o]);
    b.onclick = () => { hid.value = hid.value === o ? '' : o; sync(); hid.dispatchEvent(new Event('change')); };
    wrap.appendChild(b);
  });
  wrap.appendChild(hid); sync();
  return wrap;
}
// h: 열 이름, opts: {required, suggest:[...], segment:[...], segColors, textarea, placeholder}
function buildField(h, value, opts = {}){
  const wrap = document.createElement('div'); wrap.className = 'field'; wrap.dataset.field = h;
  const label = document.createElement(opts.segment ? 'div' : 'label');
  label.className = 'flabel';
  label.innerHTML = esc(h) + (opts.required ? ' <span class="req">*</span>' : '');
  wrap.appendChild(label);
  if (opts.segment){ wrap.appendChild(makeSeg(h, opts.segment, value, opts.segColors)); return wrap; }
  const input = document.createElement(opts.textarea ? 'textarea' : 'input');
  if (!opts.textarea) input.type = 'text';
  if (h === '위도' || h === '경도') input.inputMode = 'decimal';
  if (opts.placeholder) input.placeholder = opts.placeholder;
  input.name = h; input.value = value ?? '';
  label.htmlFor = input.id = 'f' + (fieldSeq++);
  if (opts.suggest && opts.suggest.size){ const dl = datalistFor(opts.suggest); wrap.appendChild(dl); input.setAttribute('list', dl.id); }
  wrap.appendChild(input);
  return wrap;
}
function distinct(rows, h){ return rows.map(r => str(r[h])).filter(Boolean); }

    const w = buildField(h, vals[h], { required: h === F.name || h === F.lat || h === F.lng, suggest, textarea: h === F.memo,
      placeholder: h === POWER_FIELD ? '단위까지 입력 (예: 500W, 2kW)' : '' });

    if (stHeaders.includes(F.name) && !rec[F.name]){ toast('국소명을 입력해 주세요', true); field(F.name)?.focus(); return; }

    await saving(btn, async () => {

}

// {lat,lng}: 새 지점 / {p}: 이 지점에 측정 추가 / {p, it}: 측정값 수정
function openRxForm({ p = null, it = null, lat, lng }){

      o.segment = h === R.media ? [...new Set([...RX_MEDIA, ...distinct(allMeas, h)])] : RX_SEGMENTS[h];

      const f = field(h); if (!f) return;
      const w = form.querySelector(`.field[data-field="${CSS.escape(h)}"]`);
      rec[h] = w && w.hidden ? '' : f.value.trim();     // 숨긴 칸(다른 매체용)은 비워서 저장
    });
    if (!rec[R.media]){ toast('매체를 골라 주세요', true); return; }
    if (isNewPoint){
      rec[R.name] = field(R.name).value.trim(); rec[R.lat] = field(R.lat).value.trim(); rec[R.lng] = field(R.lng).value.trim();
      if (field(R.addr)) rec[R.addr] = field(R.addr).value.trim();
      if (!rec[R.name]){ toast('지점명을 입력해 주세요', true); field(R.name).focus(); return; }
      if (!Number.isFinite(num(rec[R.lat])) || !Number.isFinite(num(rec[R.lng]))){ toast('위도·경도는 숫자로 입력해 주세요', true); return; }
    } else if (!isEdit){
      Object.assign(rec, { [R.pid]: p.pid.startsWith('_') ? '' : p.pid, [R.name]: p.name, [R.lat]: String(p.lat), [R.lng]: String(p.lng), [R.addr]: p.addr });
    }
    if (rec[R.who]) lsSet('rx_who', rec[R.who]);
    await saving(btn, async () => {
      const j = isEdit ? await api('update', { sheet:'rx', id:it[R.id], record:rec }) : await api('add', { sheet:'rx', record:rec });
      clearTemp();
      const pid = isNewPoint ? j.pid : p.pid;
      selected = null; applyData(j);
      toast(isEdit ? '저장했어요' : '추가했어요');
      if (pid && points.find(x => x.pid === pid)) select('rx', pid); else closeSheet();
    });
  };
  setTimeout(() => (isNewPoint ? field(R.name) : null)?.focus(), 100);
}

function reverseGeocode(lat, lng){
  return new Promise(resolve => {
    if (!geocoder) return resolve('');
    geocoder.coord2Address(lng, lat, (result, status) => {
      if (status !== kakao.maps.services.Status.OK || !result[0]) return resolve('');
      const r = result[0];
      resolve((r.road_address && r.road_address.address_name) || (r.address && r.address.address_name) || '');
    });
  });
}

/* ---------- 위치 옮기기 ---------- */
function startMove(type, id, name){
  moveTarget = { type, id, name };
  $('#editBannerText').textContent = `'${name || '선택한 곳'}'의 새 위치를 지도에서 누르세요`;
  if (isMobile()) $('#sheet').hidden = true;
  toast('지도에서 새 위치를 눌러 주세요');
}
function endMove(){ moveTarget = null; $('#editBannerText').textContent = editBannerText(); }
async function finishMove(lat, lng){
  const t = moveTarget; if (!t){ return; }
  showTemp(lat, lng);
  const addr = await reverseGeocode(lat, lng);
  const ok = await modal({ title:'위치를 옮길까요?',
    body:`<b>${esc(t.name || '')}</b>을(를) 이 위치로 옮깁니다.<br><span style="color:#6b7280;font-size:13px">${lat.toFixed(6)}, ${lng.toFixed(6)}${addr ? '<br>' + esc(addr) : ''}</span>`, ok:'옮기기' });
  if (!ok){ clearTemp(); return; }   // 다른 곳을 다시 누를 수 있게 이동 모드 유지
  const rec = { '위도': lat.toFixed(6), '경도': lng.toFixed(6) };
  if (addr && (t.type === 'st' ? stHeaders : rxHeaders).includes('주소')) rec['주소'] = addr;
  try {
    const j = t.type === 'st'
      ? await api('update', { sheet:'st', id:t.id, record:rec })
      : await api('updateWhere', { sheet:'rx', field:R.pid, value:t.id, record:rec });
    clearTemp(); endMove(); selected = null; applyData(j); select(t.type, t.id); toast('위치를 옮겼어요');
  } catch(e){ clearTemp(); toast(e.message, true); }
}

/* ---------- 임시 핀 ---------- */
function showTemp(lat, lng){
  clearTemp();
  const el = document.createElement('div'); el.className = 'tpin'; el.innerHTML = PIN_SVG;
  tempOverlay = new kakao.maps.CustomOverlay({ position: new kakao.maps.LatLng(lat, lng), content: el, xAnchor: .5, yAnchor: 1, zIndex: 20 });
  tempOverlay.setMap(map);
}
function clearTemp(){ if (tempOverlay){ tempOverlay.setMap(null); tempOverlay = null; } }

/* ---------- 편집 모드 ---------- */
async function toggleEdit(){
  if (editMode){ setEdit(false); return; }
  if (!password && !DEMO){
    const pw = await modal({ title:'편집 비밀번호', body:'구글 Apps Script에 정해 둔 편집 비밀번호를 입력하세요.', ok:'확인', input:{ type:'password', placeholder:'비밀번호' } });
    if (pw == null || pw === '') return;
    try { await api('check', {}, pw); password = pw; store('stmap_pw', pw); }
    catch(e){ toast(e.message, true); return; }
  }
  setEdit(true);
}
function setEdit(on){
  editMode = on;
  document.body.classList.toggle('editing', on);
  $('#btnEdit').classList.toggle('on', on);
  $('#btnEdit').textContent = on ? '✏️ 편집 중' : '✏️ 편집';
  $('#editBannerText').textContent = editBannerText();
  $('#editBanner').hidden = !on;
  map.setCursor(on ? 'crosshair' : '');
  if (!on){ endMove(); if (sheetMode === 'form') closeSheet(); clearTemp(); }
  else toast(mode === 'st' ? '지도를 누르면 새 송중계소를 추가할 수 있어요' : '지도를 누르면 새 수신지점을 추가할 수 있어요');
}

/* ---------- 목록 ---------- */
function renderList(){
  const el = $('#listPanel'); if (el.hidden) return;
  const q = $('#search').value.trim().toLowerCase();
  let items;
  if (mode === 'st'){
    items = stations.filter(s => !hidden.st.has(mediaOf(s)) && (!q || rowMatches(s, stHeaders, q)))
      .sort((a, b) => mediaOf(a).localeCompare(mediaOf(b), 'ko') || str(a[F.name]).localeCompare(str(b[F.name]), 'ko'))
      .map(s => ({ color: POWER_STYLE[powerClass(s)].color, name: s[F.name], onClick: () => select('st', s[F.id]),
        sub: [mediaOf(s), s['방송사'], s['채널/주파수'], s[F.addr]].map(str).filter(Boolean).join(' · ') }));
  } else {
    items = points.filter(p => p.items.some(it => !hidden.rx.has(mediaOf(it))) && (!q || pointMatches(p, q)))
      .sort((a, b) => a.name.localeCompare(b.name, 'ko'))
      .map(p => {
        const vis = p.items.filter(it => !hidden.rx.has(mediaOf(it))), wj = worstJudge(vis);
        return { color: wj ? wj.color : JUDGE_NONE.color, name: p.name, onClick: () => select('rx', p.pid),
          sub: [[...new Set(vis.map(mediaOf))].join('·'), p.addr].filter(Boolean).join(' · ') };
      });
  }
  const unit = mode === 'st' ? '송중계소' : '수신지점';
  el.innerHTML = `<div class="p-head"><h2>${unit} 목록 <span style="color:#6b7280;font-weight:500;font-size:14px">${items.length}곳</span></h2><button class="p-close" data-close>✕</button></div>
    <div class="p-body" id="listBody"></div>`;
  const body = el.querySelector('#listBody');
  const total = mode === 'st' ? stations.length : points.length;
  if (!items.length) body.innerHTML = `<div class="empty">${total ? '조건에 맞는 곳이 없어요.' : `아직 등록된 ${unit}이(가) 없어요.<br>위쪽 ✏️ 편집을 누르고 지도를 눌러 추가해 보세요.`}</div>`;
  items.forEach(i => {
    const d = document.createElement('div'); d.className = 'li'; d.style.setProperty('--c', i.color);
    d.innerHTML = `<span class="d"></span><div><div class="n">${esc(i.name || '(이름 없음)')}</div><div class="s">${esc(i.sub)}</div></div>`;
    d.onclick = i.onClick; body.appendChild(d);
  });
  el.querySelector('[data-close]').onclick = () => { el.hidden = true; syncListClass(); };
}
function syncListClass(){ document.body.classList.toggle('list-open', !$('#listPanel').hidden); }
function rowMatches(r, headers, q){ return headers.some(h => h !== 'id' && h !== R.pid && str(r[h]).toLowerCase().includes(q)); }
function pointMatches(p, q){
  return p.name.toLowerCase().includes(q) || p.addr.toLowerCase().includes(q) || p.items.some(it => rowMatches(it, rxHeaders, q));
}

/* ---------- 검색 ---------- */
function renderSearch(){
  const q = $('#search').value.trim();
  const box = $('#searchResults');
  if (!q){ box.hidden = true; renderList(); return; }
  const lower = q.toLowerCase();
  box.innerHTML = '';
  const add = (badgeColor, badgeText, title, sub, onClick) => {
    const d = document.createElement('div'); d.className = 'sr-item';
    d.innerHTML = `<span class="badge" style="--c:${badgeColor}">${esc(badgeText)}</span><div><div>${esc(title)}</div><div class="sr-sub">${esc(sub)}</div></div>`;
    d.onclick = () => { box.hidden = true; onClick(); map.setLevel(Math.min(map.getLevel(), 7)); };
    box.appendChild(d);
  };
  if (mode === 'st'){
    const hits = stations.filter(s => rowMatches(s, stHeaders, lower)).slice(0, 8);
    if (hits.length) box.insertAdjacentHTML('beforeend', '<div class="sr-head">등록된 송중계소</div>');
    hits.forEach(s => add(colorOf(mediaOf(s)), mediaOf(s), s[F.name] || '(이름 없음)', [s['채널/주파수'], s[F.addr]].map(str).filter(Boolean).join(' · '), () => select('st', s[F.id])));
  } else {
    const hits = points.filter(p => pointMatches(p, lower)).slice(0, 8);
    if (hits.length) box.insertAdjacentHTML('beforeend', '<div class="sr-head">등록된 수신지점</div>');
    hits.forEach(p => { const wj = worstJudge(p.items);
      add(wj ? wj.color : JUDGE_NONE.color, wj ? wj.key : '—', p.name || '(이름 없음)', [[...new Set(p.items.map(mediaOf))].join('·'), p.addr].filter(Boolean).join(' · '), () => select('rx', p.pid)); });
  }
  const pl = document.createElement('div'); pl.className = 'sr-item';
  pl.innerHTML = `<span>🔎</span><div>'${esc(q)}' 장소 찾아 이동하기<div class="sr-sub">산 이름, 주소, 건물 이름 등</div></div>`;
  pl.onclick = () => searchPlaces(q);
  box.appendChild(pl);
  box.hidden = false;
  renderList();
}
function searchPlaces(q){
  const box = $('#searchResults');
  if (!places) return;
  places.keywordSearch(q, (data, status) => {
    if (status !== kakao.maps.services.Status.OK || !data.length){
      geocoder.addressSearch(q, (res, st) => {
        if (st === kakao.maps.services.Status.OK && res[0]){ goTo(+res[0].y, +res[0].x); box.hidden = true; }
        else toast('장소를 찾지 못했어요', true);
      });
      return;
    }
    box.innerHTML = '<div class="sr-head">장소 검색 결과</div>';
    data.slice(0, 8).forEach(pl => {
      const d = document.createElement('div'); d.className = 'sr-item';
      d.innerHTML = `<span>📍</span><div><div>${esc(pl.place_name)}</div><div class="sr-sub">${esc(pl.road_address_name || pl.address_name)}</div></div>`;
      d.onclick = () => { box.hidden = true; goTo(+pl.y, +pl.x); };
      box.appendChild(d);
    });
  });
}
function goTo(lat, lng){
  map.setLevel(6); map.setCenter(new kakao.maps.LatLng(lat, lng));
  if (editMode) toast(mode === 'st' ? '원하는 지점을 눌러 송중계소를 추가하세요' : '측정한 지점을 눌러 수신지점을 추가하세요');
}

/* ---------- 내 위치 ---------- */
function myLocation(){
  if (!navigator.geolocation){ toast('이 브라우저는 위치 기능을 지원하지 않아요', true); return; }
  navigator.geolocation.getCurrentPosition(pos => {
    const ll = new kakao.maps.LatLng(pos.coords.latitude, pos.coords.longitude);
    if (meOverlay) meOverlay.setMap(null);
    const el = document.createElement('div'); el.className = 'me-dot';
    meOverlay = new kakao.maps.CustomOverlay({ position: ll, content: el, xAnchor: .5, yAnchor: .5, zIndex: 2 });
    meOverlay.setMap(map); map.setLevel(5); map.panTo(ll);
    if (editMode && mode === 'rx') toast('지금 있는 곳을 눌러 수신지점을 추가할 수 있어요');
  }, () => toast('위치를 가져오지 못했어요. 브라우저 위치 권한을 확인하세요.', true), { enableHighAccuracy: true, timeout: 10000 });
}

/* ---------- 시작 ---------- */
async function init(){
  document.title = CONFIG.TITLE; $('#title').textContent = CONFIG.TITLE;
  try { await loadKakao(); }
  catch(e){
    if (e.message === 'NO_KEY') showMapMsg(`<h2>카카오 지도 키가 필요해요</h2>
      <code>index.html</code> 위쪽 <code>CONFIG</code>의 <code>KAKAO_JS_KEY</code>에 카카오 디벨로퍼스의 <b>JavaScript 키</b>를 넣어 주세요.`);
    else showMapMsg(`<h2>카카오 지도를 불러오지 못했어요</h2>
      아래를 확인해 주세요.<br>① JavaScript 키가 맞는지 (REST API 키 아님)<br>② 카카오맵 <b>사용 설정</b>이 ON인지<br>③ JavaScript SDK 도메인에 <code>${esc(location.origin)}</code> 이 등록됐는지`);
    return;
  }
  map = new kakao.maps.Map($('#map'), { center: new kakao.maps.LatLng(36.4, 127.8), level: 13 });
  map.addControl(new kakao.maps.MapTypeControl(), kakao.maps.ControlPosition.TOPRIGHT);
  map.addControl(new kakao.maps.ZoomControl(), kakao.maps.ControlPosition.RIGHT);
  geocoder = new kakao.maps.services.Geocoder();
  places = new kakao.maps.services.Places();

  const updateZoomClass = () => {
    const lv = map.getLevel();
    $('#mapWrap').classList.toggle('far', lv > 9);
    $('#mapWrap').classList.toggle('mid', lv > 7);
  };
  kakao.maps.event.addListener(map, 'zoom_changed', updateZoomClass); updateZoomClass();
  kakao.maps.event.addListener(map, 'click', e => {
    $('#searchResults').hidden = true;
    const lat = e.latLng.getLat(), lng = e.latLng.getLng();
    if (!editMode){ if (sheetMode === 'detail') closeSheet(); return; }
    if (moveTarget){ finishMove(lat, lng); return; }
    if (sheetMode === 'detail') closeSheet(); else deselect();
    showTemp(lat, lng);
    mode === 'st' ? openStForm(null, lat, lng) : openRxForm({ lat, lng });
  });
  window.addEventListener('resize', () => map.relayout());

  document.querySelectorAll('.tab').forEach(t => t.onclick = () => setMode(t.dataset.mode));
  $('#btnEdit').onclick = toggleEdit;
  $('#btnEditOff').onclick = () => setEdit(false);
  $('#btnRefresh').onclick = () => refresh(true);
  $('#btnFit').onclick = fitAll;
  $('#btnMyLoc').onclick = myLocation;
  $('#btnList').onclick = () => {
    const el = $('#listPanel'); el.hidden = !el.hidden;
    if (!el.hidden){ if (isMobile()) $('#sheet').hidden = true; renderList(); }
    syncListClass();
  };
  $('#search').addEventListener('input', renderSearch);
  $('#search').addEventListener('focus', () => { if ($('#search').value.trim()) renderSearch(); });
  $('#search').addEventListener('keydown', e => {
    if (e.key === 'Enter'){ const first = $('#searchResults .sr-item'); if (first) first.click(); }
    if (e.key === 'Escape'){ $('#searchResults').hidden = true; }
  });
  document.addEventListener('click', e => { if (!e.target.closest('#searchWrap')) $('#searchResults').hidden = true; });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && $('#modal').hidden){ if (moveTarget){ endMove(); clearTemp(); } else if (!$('#sheet').hidden) closeSheet(); }
  });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && !DEMO && sheetMode !== 'form') refresh(false); });

  password = load('stmap_pw');
  $('#editBannerText').textContent = editBannerText();
  if (DEMO) $('#demoBanner').hidden = false;
  await refresh(false);
}
init();
</script>
</body>
